# OLSpanel Account Migrator - plugin configuration
#
# Install with:  install_cp_plugin https://your-host/plugin_account_migrator.zip
# or upload the zip through the OLSpanel admin panel.

name=Account Migrator

# Admin only: this tool creates and deletes hosting accounts.
service=admin_panel

url=/3rdparty/account_migrator/index.php
auto_login_url=/3rdparty/account_migrator/index.php

# Identity of the signed-in panel administrator, forwarded to the plugin.
# The plugin re-verifies these against the OLSpanel API before doing anything,
# and refuses to run for anyone who is not an administrator.
header[HTTP_AUTOLOGINUSER]=%username%
header[HTTP_AUTOLOGINTOKEN]=%usertoken%

# Root is required: the migrator chowns transferred files and imports database
# dumps using the server's own MySQL credentials.
user=root
group=root

# Where the plugin should appear. "advance" is the admin-only section; the
# panel only lists a plugin under the feature tags named here.
features=advance

# The installer copies plugin_icon.png out of the archive into
# media/icon/<plugin name>.png, which is where the panel looks for it.
icon=/media/icon/account_migrator.png

sorder=50

target=_self